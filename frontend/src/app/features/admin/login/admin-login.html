<div class="login-page">
  <form class="login-card" (ngSubmit)="submit()">
    <h1>Sol Isla Admin</h1>

    @if (error(); as message) {
      <p-message severity="error" [text]="message" />
    }

    <label for="email">Email</label>
    <input id="email" type="email" pInputText name="email" [(ngModel)]="email" required autocomplete="username" />

    <label for="password">Password</label>
    <p-password id="password" name="password" [(ngModel)]="password" [feedback]="false" [toggleMask]="true"
                autocomplete="current-password" />

    <p-button type="submit" label="Log in" [loading]="submitting()" [disabled]="!email || !password" />
  </form>
</div>
